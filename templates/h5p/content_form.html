{% extends "base.html" %}

{% block title %}Create H5P Content{% endblock %}

{% block content %}
<h1 class="mt-4">Create H5P Content</h1>
<hr />

<form method="post" class="card p-4 shadow-sm">
  {% csrf_token %}
  {{ form.as_p }}

  <button type="submit" class="btn btn-primary">
    <i class="fas fa-save"></i> Save
  </button>
  <a href="{% url 'h5p:content_list' %}" class="btn btn-secondary">
    Cancel
  </a>
</form>
{% endblock %}
