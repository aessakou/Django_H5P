{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="container py-5" style="max-width: 420px;">
	<h1 class="h4 mb-3">Login</h1>
	<form method="post">
		{% csrf_token %}
		{{ form.as_p }}
		<button type="submit" class="btn btn-primary">Sign in</button>
	</form>
</div>
{% endblock %}
